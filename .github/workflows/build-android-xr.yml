name: Build Android XR Debug APKs

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-xr-apk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.20f1

jobs:
  build-apk:
    name: Build ${{ matrix.preset }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Meta Quest 3 Debug
            target: quest3
            package_name: com.unity.xr.meta-openxr
            package_version: 2.3.0
            apk: scene-sync-unity-quest3-debug.apk
            artifact: scene-sync-unity-quest3-debug
          - preset: PICO 4 Ultra Debug
            target: pico4-ultra
            package_name: com.unity.xr.openxr.picoxr
            package_version: "https://github.com/Pico-Developer/PICO-Unity-OpenXR-SDK.git#release_1.4.0"
            apk: scene-sync-unity-pico4-ultra-debug.apk
            artifact: scene-sync-unity-pico4-ultra-debug
          - preset: VIVE Focus Vision Debug
            target: vive-focus-vision
            package_name: com.htc.upm.vive.openxr
            package_version: 2.5.1
            apk: scene-sync-unity-vive-focus-vision-debug.apk
            artifact: scene-sync-unity-vive-focus-vision-debug
          - preset: Android XR Debug
            target: android-xr
            package_name: com.unity.xr.androidxr-openxr
            package_version: 1.0.1
            apk: scene-sync-unity-android-xr-debug.apk
            artifact: scene-sync-unity-android-xr-debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select ${{ matrix.preset }} vendor package
        shell: bash
        env:
          XR_PACKAGE_NAME: ${{ matrix.package_name }}
          XR_PACKAGE_VERSION: ${{ matrix.package_version }}
        run: |
          set -euo pipefail

          MANIFEST=Packages/manifest.json
          UPDATED_MANIFEST="$RUNNER_TEMP/manifest-${{ matrix.target }}.json"

          jq \
            --arg package "$XR_PACKAGE_NAME" \
            --arg version "$XR_PACKAGE_VERSION" \
            '
              .dependencies |= del(
                .["com.htc.upm.vive.openxr"],
                .["com.unity.xr.androidxr-openxr"],
                .["com.unity.xr.meta-openxr"],
                .["com.unity.xr.openxr.picoxr"],
                .["com.unity.polyspatial"],
                .["com.unity.polyspatial.extensions"],
                .["com.unity.polyspatial.serialization"],
                .["com.unity.polyspatial.visionos"],
                .["com.unity.polyspatial.xr"],
                .["com.unity.xr.visionos"],
                .["io.github.hatayama.uloopmcp"]
              )
              | .dependencies[$package] = $version
              | .scopedRegistries |= map(
                  if .name == "OpenUPM" then
                    .scopes = (
                      if $package == "com.htc.upm.vive.openxr" then
                        (.scopes + ["com.htc"] | unique)
                      else
                        (.scopes | map(select(. != "com.htc")))
                      end
                    )
                  else . end
                )
            ' "$MANIFEST" > "$UPDATED_MANIFEST"
          mv "$UPDATED_MANIFEST" "$MANIFEST"

          test "$(
            jq '[.dependencies | keys[] | select(
              . == "com.htc.upm.vive.openxr"
              or . == "com.unity.xr.androidxr-openxr"
              or . == "com.unity.xr.meta-openxr"
              or . == "com.unity.xr.openxr.picoxr"
            )] | length' "$MANIFEST"
          )" -eq 1
          jq -e \
            --arg package "$XR_PACKAGE_NAME" \
            --arg version "$XR_PACKAGE_VERSION" \
            '.dependencies[$package] == $version
              and .dependencies["com.unity.polyspatial"] == null
              and .dependencies["com.unity.polyspatial.extensions"] == null
              and .dependencies["com.unity.polyspatial.serialization"] == null
              and .dependencies["com.unity.polyspatial.visionos"] == null
              and .dependencies["com.unity.polyspatial.xr"] == null
              and .dependencies["com.unity.xr.visionos"] == null
              and .dependencies["io.github.hatayama.uloopmcp"] == null' \
            "$MANIFEST" > /dev/null

      - name: Restore Unity build cache
        id: unity-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Library/Bee
            Library/BuildPlayerData
            Library/PlayerDataCache
            Library/ScriptAssemblies
            Library/ShaderCache
            Library/ShaderCache.db
            Library/ShaderGraphs
          key: UnityBuild-${{ runner.os }}-${{ env.UNITY_VERSION }}-Android-${{ matrix.target }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            UnityBuild-${{ runner.os }}-${{ env.UNITY_VERSION }}-Android-${{ matrix.target }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}-
            UnityBuild-${{ runner.os }}-${{ env.UNITY_VERSION }}-Android-${{ matrix.target }}-

      - name: Restore legacy Unity Library seed
        if: steps.unity-build-cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            Library/ArtifactDB
            Library/Artifacts
            Library/Bee
            Library/BuildPlayerData
            Library/PackageManager
            Library/PlayerDataCache
            Library/ScriptAssemblies
            Library/ShaderCache
            Library/ShaderCache.db
            Library/ShaderGraphs
            Library/SourceAssetDB
          key: Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-Android-${{ matrix.target }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}-${{ github.run_attempt }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-Android-${{ matrix.target }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
            Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-Android-${{ matrix.target }}-

      - name: Rebuild Unity asset and package databases
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- \
            Library/ArtifactDB \
            Library/Artifacts \
            Library/PackageManager \
            Library/SourceAssetDB

      - name: Verify Unity CI secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Build ${{ matrix.preset }} APK
        timeout-minutes: 40
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          buildMethod: SceneSync.UnityClient.Editor.SceneSyncAndroidXrBuild.Build
          customParameters: >-
            -refreshImportMode InProcess
            -desiredWorkerCount 1
            -standbyWorkerCount 0
            -sceneSyncXrTarget ${{ matrix.target }}
            -sceneSyncOutput build/${{ matrix.apk }}
          allowDirtyBuild: true

      - name: Upload ${{ matrix.preset }} diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: unity-diagnostics-${{ matrix.target }}
          path: |
            Logs/
            Library/LastBuild.buildreport
          if-no-files-found: warn
          retention-days: 7

      - name: Verify ${{ matrix.preset }} APK
        shell: bash
        env:
          OUTPUT_APK: build/${{ matrix.apk }}
        run: |
          set -euo pipefail
          test -s "$OUTPUT_APK"
          APK_ENTRIES="$RUNNER_TEMP/${{ matrix.target }}-apk-entries.txt"
          unzip -Z1 "$OUTPUT_APK" > "$APK_ENTRIES"
          grep -Fxq 'lib/arm64-v8a/libunity.so' "$APK_ENTRIES"
          grep -Fxq 'lib/arm64-v8a/libil2cpp.so' "$APK_ENTRIES"
          grep -Fxq 'lib/arm64-v8a/librapier_unity_ffi.so' "$APK_ENTRIES"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Stop timed-out Unity build container
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t unity_containers < <(
            docker ps --quiet \
              --filter "ancestor=unityci/editor:ubuntu-${UNITY_VERSION}-android-3"
          )
          if (( ${#unity_containers[@]} > 0 )); then
            docker stop --time 15 "${unity_containers[@]}"
          fi

      - name: Save Unity build cache
        if: always() && steps.unity-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Library/Bee
            Library/BuildPlayerData
            Library/PlayerDataCache
            Library/ScriptAssemblies
            Library/ShaderCache
            Library/ShaderCache.db
            Library/ShaderGraphs
          key: ${{ steps.unity-build-cache.outputs.cache-primary-key }}
